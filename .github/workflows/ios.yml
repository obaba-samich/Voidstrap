name: iOS build

on:
  push:
    paths: &ios-paths
      - "Ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths: *ios-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install xtool
        run: brew install xtool-org/tap/xtool
      - name: Sync the version into Info.plist
        working-directory: Ios
        run: sh scripts/sync-version.sh
      - name: Build the IPA
        working-directory: Ios
        run: xtool dev build --configuration release --ipa
      - name: Write the checksum
        working-directory: Ios/xtool
        run: shasum -a 256 *.ipa > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: voidstrap-ios
          path: |
            Ios/xtool/*.ipa
            Ios/xtool/SHA256SUMS
